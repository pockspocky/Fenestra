<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fenestra - Start Menu</title>
  <!-- Import pixel font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* Global CSS resets for pixel-perfect layout */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      /* Set image-rendering properties globally for all elements */
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* Remove anti-aliasing from all elements */
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
      font-smooth: never;
      /* Ensure all transitions are instant */
      transition: none !important;
      animation-duration: 0s !important;
    }

    /* Allow specific elements to override transition behavior if needed */
    *[data-allow-transition] {
      transition: revert !important;
    }

    html {
      /* Set image-rendering at root level */
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    body {
      /* Apply pixel font with fallback fonts for graceful degradation */
      font-family: 'Press Start 2P', 'Courier New', 'Courier', monospace;
      /* Replace gradient background with retro color scheme */
      background: #0f380f;
      /* Add pixel grid pattern overlay using CSS gradients */
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      /* Configure image-rendering for crisp pixel display */
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* Remove anti-aliasing */
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      text-align: center;
      max-width: 500px;
      padding: 40px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      font-family: 'Press Start 2P', 'Courier New', 'Courier', monospace;
      line-height: 1.5;
    }

    .subtitle {
      font-size: 12px;
      margin-bottom: 40px;
      opacity: 0.9;
      font-family: 'Press Start 2P', 'Courier New', 'Courier', monospace;
      line-height: 1.5;
    }

    .save-info {
      /* Replace blur backdrop with solid background */
      background: #000000;
      /* Add pixelized border styling - sharp borders, no rounded corners */
      border: 3px solid #44cf6c;
      border-radius: 0;
      padding: 15px;
      margin-bottom: 30px;
      font-size: 10px;
      /* Remove blur effect */
      backdrop-filter: none;
      font-family: 'Press Start 2P', 'Courier New', 'Courier', monospace;
      line-height: 1.8;
      /* Apply box-shadow for retro depth effect */
      box-shadow: 
        3px 3px 0 rgba(76, 205, 196, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .save-info.hidden {
      display: none;
    }

    .save-timestamp {
      font-weight: 600;
      margin-top: 10px;
      font-family: 'Press Start 2P', 'Courier New', 'Courier', monospace;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    button {
      padding: 15px 30px;
      font-size: 14px;
      font-weight: 600;
      /* Replace rounded borders with sharp pixel-perfect borders */
      border: 4px solid #ffffff;
      border-radius: 0;
      cursor: pointer;
      position: relative;
      overflow: visible;
      font-family: 'Press Start 2P', 'Courier New', 'Courier', monospace;
      line-height: 1.5;
      /* Implement box-shadow pixel art effects for depth */
      box-shadow: 
        4px 4px 0 #000000,
        inset -2px -2px 0 rgba(0,0,0,0.5);
    }

    button span {
      position: relative;
      z-index: 1;
    }

    .btn-new-game {
      background: #44cf6c;
      color: white;
    }

    /* Style hover states with instant transitions */
    .btn-new-game:hover {
      background: #45a049;
      /* Style active/click states with position shifts */
      transform: translate(2px, 2px);
      box-shadow: 
        2px 2px 0 #000000,
        inset -2px -2px 0 rgba(0,0,0,0.5);
    }

    /* Style active/click states with position shifts */
    .btn-new-game:active {
      transform: translate(4px, 4px);
      box-shadow: none;
    }

    .btn-continue {
      background: #63e2c6;
      color: white;
    }

    /* Style hover states with instant transitions */
    .btn-continue:hover:not(:disabled) {
      background: #5abcb9;
      /* Style active/click states with position shifts */
      transform: translate(2px, 2px);
      box-shadow: 
        2px 2px 0 #000000,
        inset -2px -2px 0 rgba(0,0,0,0.5);
    }

    /* Style active/click states with position shifts */
    .btn-continue:active:not(:disabled) {
      transform: translate(4px, 4px);
      box-shadow: none;
    }

    /* Style disabled state with retro gray palette */
    .btn-continue:disabled {
      background: #666666;
      border-color: #999999;
      color: #cccccc;
      cursor: not-allowed;
      box-shadow: 
        4px 4px 0 #333333,
        inset -2px -2px 0 rgba(0,0,0,0.5);
    }

    .keyboard-hint {
      margin-top: 30px;
      font-size: 10px;
      opacity: 0.7;
      font-family: 'Press Start 2P', 'Courier New', 'Courier', monospace;
      line-height: 1.8;
    }

    /* Style kbd elements as pixel art buttons */
    .keyboard-hint kbd {
      /* Solid background instead of transparent */
      background: #333333;
      /* Add borders for retro key appearance - sharp, no rounded corners */
      border: 2px solid #ffffff;
      border-radius: 0;
      /* Add shadows for retro key appearance - pixel art depth effect */
      box-shadow: 2px 2px 0 #000000;
      /* Maintain pixel-perfect spacing */
      padding: 4px 8px;
      margin: 0 2px;
      /* Ensure pixel font rendering for hint text */
      font-family: 'Press Start 2P', 'Courier New', 'Courier', monospace;
      font-weight: 600;
      font-size: 10px;
      /* Display as inline-block for proper spacing */
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fenestra</h1>
    <p class="subtitle">A Window-Based Puzzle Game</p>
    
    <div id="saveInfo" class="save-info hidden">
      <div>Saved game available</div>
      <div class="save-timestamp" id="saveTimestamp"></div>
    </div>
    
    <div class="buttons">
      <button class="btn-new-game" id="btnNewGame">
        <span>New Game</span>
      </button>
      <button class="btn-continue" id="btnContinue">
        <span>Continue Game</span>
      </button>
    </div>
    
    <div class="keyboard-hint">
      Keyboard shortcuts: <kbd>N</kbd> New Game · <kbd>C</kbd> Continue
    </div>
  </div>

  <script>
    console.log('[START_MENU_HTML] Script is executing!');
    console.log('[START_MENU_HTML] window.location:', window.location.href);
    console.log('[START_MENU_HTML] window.location.search:', window.location.search);
    
    // Get query parameters
    const urlParams = new URLSearchParams(window.location.search);
    console.log('[START_MENU_HTML] URLSearchParams created');
    
    const saveExists = urlParams.get('saveExists') === 'true';
    const saveTimestamp = urlParams.get('saveTimestamp');
    const saveWindowCount = urlParams.get('saveWindowCount');
    const saveIsValid = urlParams.get('saveIsValid') === 'true';

    console.log('[START_MENU_HTML] Parsed query params:', {
      saveExists,
      saveTimestamp,
      saveWindowCount,
      saveIsValid,
      raw: {
        saveExists: urlParams.get('saveExists'),
        saveTimestamp: urlParams.get('saveTimestamp'),
        saveWindowCount: urlParams.get('saveWindowCount'),
        saveIsValid: urlParams.get('saveIsValid')
      }
    });

    // Get elements
    const btnNewGame = document.getElementById('btnNewGame');
    const btnContinue = document.getElementById('btnContinue');
    const saveInfo = document.getElementById('saveInfo');
    const saveTimestampEl = document.getElementById('saveTimestamp');

    console.log('[START_MENU] Save exists:', saveExists);

    // Configure continue button based on save state
    if (saveExists && saveIsValid) {
      console.log('[START_MENU] Save exists and is valid');
      btnContinue.disabled = false;
      saveInfo.classList.remove('hidden');
      
      // Format timestamp
      if (saveTimestamp) {
        const date = new Date(saveTimestamp);
        const formattedDate = date.toLocaleString();
        saveTimestampEl.textContent = `Last saved: ${formattedDate} (${saveWindowCount} windows)`;
      }
    } else {
      console.log('[START_MENU] Save does not exist or is invalid');
      btnContinue.disabled = true;
    }

    // Button click handlers
    btnNewGame.addEventListener('click', () => {
      console.log('[START_MENU] New Game button clicked');
      window.electronAPI.startNewGame();
    });

    btnContinue.addEventListener('click', () => {
      if (!btnContinue.disabled) {
        console.log('[START_MENU] Continue Game button clicked');
        window.electronAPI.startContinueGame();
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      
      if (key === 'n') {
        btnNewGame.click();
      } else if (key === 'c' && !btnContinue.disabled) {
        btnContinue.click();
      }
    });

    // Focus on appropriate button
    if (saveExists && saveIsValid) {
      btnContinue.focus();
    } else {
      btnNewGame.focus();
    }
  </script>
</body>
</html>
