<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .id { font-weight: bold; }
    .row { margin: 10px 0; }
    button { padding: 6px 10px; }
    code { background: #f2f2f2; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="row">This is window: <span class="id" id="id"></span></div>
  <div class="row">
    <button id="btn-create">Create test window</button>
    <button id="btn-bounds">Log my bounds</button>
  </div>
  <div class="row"><small>Close the <code>video</code> window to spawn <code>door</code> & <code>key</code>. Drag them to overlap (≥60%).</small></div>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || 'unknown';
    document.getElementById('id').textContent = id;

    document.getElementById('btn-create').onclick = async () => {
      await window.api.invoke('game/window/create', {
        id: 'temp-' + Math.random().toString(36).slice(2, 8),
        bounds: { width: 300, height: 200 }
      });
    };
    document.getElementById('btn-bounds').onclick = async () => {
      const res = await window.api.invoke('game/window/get-bounds', { id });
      console.log('bounds', id, res);
      alert(JSON.stringify(res, null, 2));
    };
  </script>
</body>
</html>
