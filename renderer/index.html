<!doctype html>
<html>
<head>
  <meta charset="utf-8" />

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self'">
    <style>
    body { font-family: sans-serif; margin: 20px; }
    .id { font-weight: bold; }
    .row { margin: 10px 0; }
    button { padding: 6px 10px; }
    code { background: #f2f2f2; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="title" id="title"></div>
    <div class="window-controls">
      <button class="btn btn-minimize" id="btn-minimize" title="Minimize">−</button>
      <button class="btn btn-maximize" id="btn-maximize" title="Maximize/Restore">□</button>
      <button class="btn btn-close" id="btn-close" title="Close">×</button>
    </div>
  </div>
  
  <div class="content">
    <div class="row">This is window: <span class="id" id="id"></span></div>
    <div class="row">
      <button id="btn-create">Create test window</button>
      <button id="btn-bounds">Log my bounds</button>
    </div>
    <div class="row"><small>Close the <code>video</code> window to spawn <code>door</code> & <code>key</code>. Drag them to overlap (≥60%).</small></div>
  </div>
  
  <script type="module">

    console.log('[RENDERER] 渲染进程脚本开始执行');
    console.log('[RENDERER] 当前URL:', location.href);
    const params = new URLSearchParams(location.search);
    console.log('[RENDERER] URL参数:', Object.fromEntries(params.entries()));
    
    const id = params.get('id') || 'unknown';
    
    console.log(`[RENDERER] 窗口ID: ${id}`);
    
    // 设置窗口ID显示
    const idElement = document.getElementById('id');
    if (idElement) {
      idElement.textContent = id;
      console.log('[RENDERER] 窗口ID已显示在页面上');
    } else {
      console.error('[RENDERER] 无法找到ID显示元素');
    }

    // 页面加载完成事件
    document.addEventListener('DOMContentLoaded', () => {
      console.log('[RENDERER] DOM内容已加载完成');
    });

    // 窗口加载完成事件
    window.addEventListener('load', () => {
      console.log('[RENDERER] 窗口已完全加载');
    });

    // 创建窗口按钮
    const createBtn = document.getElementById('btn-create');
    if (createBtn) {
      console.log('[RENDERER] 绑定创建窗口按钮事件');
      createBtn.onclick = async () => {
        console.log('[RENDERER] 用户点击创建窗口按钮');
        
        const newId = 'temp-' + Math.random().toString(36).slice(2, 8);
        const payload = {
          id: newId,
          bounds: { width: 300, height: 200 }
        };
        
        console.log('[RENDERER] 准备创建新窗口:', payload);
        
        try {
          const result = await window.api.invoke('game/window/create', payload);
          console.log('[RENDERER] 创建窗口响应:', result);
          
          if (result.ok) {
            console.log(`[RENDERER] 窗口创建成功, ID: ${result.id}, webContentsId: ${result.webContentsId}`);
          } else {
            console.error('[RENDERER] 窗口创建失败:', result.error);
          }
        } catch (error) {
          console.error('[RENDERER] 创建窗口时发生错误:', error);
        }
      };
    } else {
      console.error('[RENDERER] 无法找到创建窗口按钮');
    }

    // 获取边界按钮
    const boundsBtn = document.getElementById('btn-bounds');
    if (boundsBtn) {
      console.log('[RENDERER] 绑定获取边界按钮事件');
      boundsBtn.onclick = async () => {
        console.log('[RENDERER] 用户点击获取边界按钮');
        console.log(`[RENDERER] 请求获取窗口边界, ID: ${id}`);
        
        try {
          const res = await window.api.invoke('game/window/get-bounds', { id });
          console.log(`[RENDERER] 获取边界响应 (${id}):`, res);
          
          if (res.ok) {
            console.log(`[RENDERER] 窗口边界 (${id}):`, res.bounds);
          } else {
            console.error(`[RENDERER] 获取边界失败 (${id}):`, res.error);
          }
          
          // 显示结果对话框
          const resultText = JSON.stringify(res, null, 2);
          console.log('[RENDERER] 显示边界信息对话框');
          alert(resultText);
          console.log('[RENDERER] 边界信息对话框已关闭');
          
        } catch (error) {
          console.error('[RENDERER] 获取边界时发生错误:', error);
          alert(`错误: ${error.message}`);
        }
      };
    } else {
      console.error('[RENDERER] 无法找到获取边界按钮');
    }

    // 窗口焦点事件
    window.addEventListener('focus', () => {
      console.log(`[RENDERER] 窗口获得焦点 (${id})`);
    });

    window.addEventListener('blur', () => {
      console.log(`[RENDERER] 窗口失去焦点 (${id})`);
    });

    // 窗口关闭前事件
    window.addEventListener('beforeunload', (event) => {
      console.log(`[RENDERER] 窗口即将关闭 (${id})`);
    });

    // 页面可见性变化事件
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        console.log(`[RENDERER] 页面变为可见 (${id})`);
      } else {
        console.log(`[RENDERER] 页面变为隐藏 (${id})`);
      }
    });

    console.log('[RENDERER] 所有事件监听器已设置完成');
    console.log('[RENDERER] 渲染进程脚本执行完成');
    document.getElementById('id').textContent = id;

    // 平台特定UI调整
    const titlebar = document.querySelector('.titlebar');
    const windowControls = document.querySelector('.window-controls');
    
    console.log('titlebar element:', titlebar);
    console.log('windowControls element:', windowControls);
    
    if (isMac) {
      console.log('Applying Mac-specific styles...');
      if (titlebar) {
        titlebar.classList.add('mac');
        console.log('Added mac class to titlebar');
      }
      if (windowControls) {
        windowControls.classList.add('hidden');
        console.log('Added hidden class to windowControls');
        console.log('windowControls classes:', windowControls.classList.toString());
      }
    } else {
      console.log('Not Mac, keeping default styles');
    }

    // 立即设置默认标题
    document.getElementById('title').textContent = id;

    // 初始化标题
    async function initTitle() {
      console.log('Initializing title...');
      try {
        if (!window.api || !window.api.getTitle) {
          console.log('API not available, keeping default id:', id);
          return;
        }
        
        const title = await window.api.getTitle();
        console.log('Got title:', title);
        
        if (title && title.trim()) {
          document.getElementById('title').textContent = title;
          console.log('Title set to:', title);
        } else {
          console.log('Empty title, keeping id:', id);
        }
      } catch (error) {
        console.error('Failed to get title:', error);
        console.log('Keeping default id:', id);
      }
    }
    
    // 等待API可用后尝试获取真实标题
    setTimeout(() => {
      initTitle();
    }, 300); // 给API更多准备时间

    // 窗口控制按钮（仅在非Mac平台使用）
    if (!isMac) {
      document.getElementById('btn-minimize').onclick = () => {
        window.api.minimize();
      };
      
      document.getElementById('btn-maximize').onclick = () => {
        window.api.maximizeToggle();
      };
      
      document.getElementById('btn-close').onclick = () => {
        window.api.close();
      };
    }

    // 游戏功能按钮
    document.getElementById('btn-create').onclick = async () => {
      await window.api.invoke('game/window/create', {
        id: 'temp-' + Math.random().toString(36).slice(2, 8),
        bounds: { width: 300, height: 200 }
      });
    };
    
    document.getElementById('btn-bounds').onclick = async () => {
      const res = await window.api.invoke('game/window/get-bounds', { id });
      console.log('bounds', id, res);
      alert(JSON.stringify(res, null, 2));
    };
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
