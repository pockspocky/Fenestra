<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #f0f0f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #content-container {
      width: 100%;
      height: 100%;
      position: relative;
      transition: filter 0.3s ease;
    }

    #content-container.blurred {
      filter: blur(10px);
    }

    /* Text content styles */
    .text-content {
      padding: 40px;
      font-size: 18px;
      line-height: 1.8;
      color: #333;
      min-width: 800px;
      min-height: 600px;
    }

    /* Image content styles */
    .image-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .image-content img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Loading state */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #666;
    }

    /* Error state */
    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #d32f2f;
    }

    #error h2 {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <div id="error" style="display: none;">
    <h2>⚠️ Loading Failed</h2>
    <p id="error-message"></p>
  </div>
  <div id="content-container"></div>

  <script>
    console.log('[CONTENT] Content Viewer initialized');

    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const contentType = urlParams.get('type') || 'text'; // 'text' or 'image'
    const contentPath = urlParams.get('path') || '';
    const surfaceContent = urlParams.get('surfaceContent') || ''; // Surface content (blurred display)
    const blurAmount = parseFloat(urlParams.get('blur')) || 10;
    const isBlurred = urlParams.get('blurred') === 'true';

    console.log('[CONTENT] Parameters:', { contentType, contentPath, surfaceContent: surfaceContent.substring(0, 50), blurAmount, isBlurred });

    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const errorMessageEl = document.getElementById('error-message');
    const containerEl = document.getElementById('content-container');

    // Set initial blur state
    if (isBlurred) {
      containerEl.style.filter = `blur(${blurAmount}px)`;
    }

    // Load content
    async function loadContent() {
      try {
        if (contentType === 'image') {
          await loadImage(contentPath);
        } else if (contentType === 'text') {
          await loadText(contentPath);
        } else {
          throw new Error('Unknown content type: ' + contentType);
        }

        loadingEl.style.display = 'none';
        console.log('[CONTENT] Content loaded successfully');
      } catch (error) {
        console.error('[CONTENT] Loading failed:', error);
        loadingEl.style.display = 'none';
        errorMessageEl.textContent = error.message;
        errorEl.style.display = 'block';
      }
    }

    // Load image (display surface image)
    async function loadImage(imagePath) {
      console.log('[CONTENT] Loading image - surface image');

      // Prioritize surfaceContent (surface image path)
      let actualImagePath = imagePath;
      if (surfaceContent) {
        actualImagePath = surfaceContent;
        console.log('[CONTENT] Using surface image path: ' + actualImagePath);
      }

      if (!actualImagePath) {
        throw new Error('Image path not specified');
      }

      const imageData = await window.electronAPI.loadPicture(actualImagePath);
      
      if (!imageData.success) {
        throw new Error(imageData.error || 'Failed to load image');
      }

      const imgDiv = document.createElement('div');
      imgDiv.className = 'image-content';
      
      const img = document.createElement('img');
      img.src = imageData.dataUrl;
      img.alt = 'Surface image';
      
      imgDiv.appendChild(img);
      containerEl.appendChild(imgDiv);
    }

    // Load text (display surface content)
    async function loadText(textPath) {
      console.log('[CONTENT] Loading text - surface content');

      let textContent = '';

      // Prioritize surfaceContent (surface content)
      if (surfaceContent) {
        textContent = surfaceContent;
        console.log('[CONTENT] Using surface content (length: ' + textContent.length + ')');
      } else if (textPath && textPath.startsWith('file://')) {
        // Load from file (backward compatibility)
        const response = await fetch(textPath);
        textContent = await response.text();
      } else if (textPath) {
        // Use passed text directly (backward compatibility)
        textContent = decodeURIComponent(textPath);
      } else {
        textContent = 'This is secret text.\n\nOnly through a lens window can you see this content clearly.\n\nYou can try creating a lens window to view the clear text.';
      }

      const textDiv = document.createElement('div');
      textDiv.className = 'text-content';
      textDiv.textContent = textContent;
      
      containerEl.appendChild(textDiv);
    }

    // Listen for blur changes
    window.electronAPI.onUpdateBlur((blurValue) => {
      console.log('[CONTENT] Update blur:', blurValue);
      if (blurValue === 0) {
        containerEl.style.filter = 'none';
      } else {
        containerEl.style.filter = `blur(${blurValue}px)`;
      }
    });

    // Listen for content changes
    window.electronAPI.onContentChange((data) => {
      console.log('[CONTENT] Content changed:', data);
      containerEl.innerHTML = '';
      loadContent();
    });

    // Initial load
    loadContent();
  </script>
</body>
</html>
