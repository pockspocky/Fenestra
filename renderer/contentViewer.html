<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #f0f0f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #content-container {
      width: 100%;
      height: 100%;
      position: relative;
      transition: filter 0.3s ease;
    }

    #content-container.blurred {
      filter: blur(10px);
    }

    /* 文字内容样式 */
    .text-content {
      padding: 40px;
      font-size: 18px;
      line-height: 1.8;
      color: #333;
      min-width: 800px;
      min-height: 600px;
    }

    /* 图片内容样式 */
    .image-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .image-content img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* 加载状态 */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #666;
    }

    /* 错误状态 */
    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #d32f2f;
    }

    #error h2 {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="loading">加载中...</div>
  <div id="error" style="display: none;">
    <h2>⚠️ 加载失败</h2>
    <p id="error-message"></p>
  </div>
  <div id="content-container"></div>

  <script>
    console.log('[CONTENT] Content Viewer 初始化');

    // 解析URL参数
    const urlParams = new URLSearchParams(window.location.search);
    const contentType = urlParams.get('type') || 'text'; // 'text' 或 'image'
    const contentPath = urlParams.get('path') || '';
    const surfaceContent = urlParams.get('surfaceContent') || ''; // 表面内容（模糊显示）
    const blurAmount = parseFloat(urlParams.get('blur')) || 10;
    const isBlurred = urlParams.get('blurred') === 'true';

    console.log('[CONTENT] 参数:', { contentType, contentPath, surfaceContent: surfaceContent.substring(0, 50), blurAmount, isBlurred });

    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const errorMessageEl = document.getElementById('error-message');
    const containerEl = document.getElementById('content-container');

    // 设置初始模糊状态
    if (isBlurred) {
      containerEl.style.filter = `blur(${blurAmount}px)`;
    }

    // 加载内容
    async function loadContent() {
      try {
        if (contentType === 'image') {
          await loadImage(contentPath);
        } else if (contentType === 'text') {
          await loadText(contentPath);
        } else {
          throw new Error('未知的内容类型: ' + contentType);
        }

        loadingEl.style.display = 'none';
        console.log('[CONTENT] 内容加载成功');
      } catch (error) {
        console.error('[CONTENT] 加载失败:', error);
        loadingEl.style.display = 'none';
        errorMessageEl.textContent = error.message;
        errorEl.style.display = 'block';
      }
    }

    // 加载图片（显示表面图片）
    async function loadImage(imagePath) {
      console.log('[CONTENT] 加载图片 - 表面图片');

      // 优先使用 surfaceContent（表面图片路径）
      let actualImagePath = imagePath;
      if (surfaceContent) {
        actualImagePath = surfaceContent;
        console.log('[CONTENT] 使用表面图片路径: ' + actualImagePath);
      }

      if (!actualImagePath) {
        throw new Error('未指定图片路径');
      }

      const imageData = await window.electronAPI.loadPicture(actualImagePath);
      
      if (!imageData.success) {
        throw new Error(imageData.error || '加载图片失败');
      }

      const imgDiv = document.createElement('div');
      imgDiv.className = 'image-content';
      
      const img = document.createElement('img');
      img.src = imageData.dataUrl;
      img.alt = '表面图片';
      
      imgDiv.appendChild(img);
      containerEl.appendChild(imgDiv);
    }

    // 加载文字（显示表面内容）
    async function loadText(textPath) {
      console.log('[CONTENT] 加载文字 - 表面内容');

      let textContent = '';

      // 优先使用 surfaceContent（表面内容）
      if (surfaceContent) {
        textContent = surfaceContent;
        console.log('[CONTENT] 使用表面内容（长度: ' + textContent.length + '）');
      } else if (textPath && textPath.startsWith('file://')) {
        // 从文件加载（向后兼容）
        const response = await fetch(textPath);
        textContent = await response.text();
      } else if (textPath) {
        // 直接使用传入的文字（向后兼容）
        textContent = decodeURIComponent(textPath);
      } else {
        textContent = '这是一段秘密文字。\n\n只有通过镜头窗口才能看清楚这些内容。\n\n您可以尝试创建一个镜头窗口来查看清晰的文字。';
      }

      const textDiv = document.createElement('div');
      textDiv.className = 'text-content';
      textDiv.textContent = textContent;
      
      containerEl.appendChild(textDiv);
    }

    // 监听模糊度变化
    window.electronAPI.onUpdateBlur((blurValue) => {
      console.log('[CONTENT] 更新模糊度:', blurValue);
      if (blurValue === 0) {
        containerEl.style.filter = 'none';
      } else {
        containerEl.style.filter = `blur(${blurValue}px)`;
      }
    });

    // 监听内容变化
    window.electronAPI.onContentChange((data) => {
      console.log('[CONTENT] 内容变化:', data);
      containerEl.innerHTML = '';
      loadContent();
    });

    // 初始加载
    loadContent();
  </script>
</body>
</html>
