<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lens Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      cursor: move;
      -webkit-app-region: drag; /* Allow entire window to be draggable */
    }

    /* Lens frame */
    #lens-frame {
      width: 100%;
      height: 100%;
      position: relative;
      border: 3px solid rgba(0, 150, 255, 0.8);
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(1px);
      -webkit-app-region: drag; /* Entire frame area is draggable */
    }

    /* Content container */
    #lens-content {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background: #fff;
      -webkit-app-region: drag; /* Content area is also draggable */
    }

    /* Text content */
    .text-content {
      position: absolute;
      top: 0;
      left: 0;
      padding: 40px;
      font-size: 18px;
      line-height: 1.8;
      color: #333;
      background: #fff;
      min-width: 800px;
      min-height: 600px;
      transform-origin: top left;
      -webkit-app-region: drag; /* Text area is draggable */
      pointer-events: none; /* Disable text selection to ensure smooth dragging */
    }

    /* Image content */
    .image-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag; /* Image area is draggable */
      background: #000;
    }

    .image-content img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none; /* Disable image interaction to ensure smooth dragging */
    }

    /* Loading state */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      color: #0096ff;
      text-align: center;
      -webkit-app-region: drag; /* Loading area is draggable */
      pointer-events: none;
    }

    /* Lens label */
    #lens-label {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(0, 150, 255, 0.8);
      color: white;
      padding: 2px 8px;
      font-size: 12px;
      border-radius: 3px;
      pointer-events: none; /* Label does not block dragging */
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="lens-frame">
    <div id="lens-label"></div>
    <div id="loading">🔍 Loading lens...</div>
    <div id="lens-content"></div>
  </div>

  <script>
    console.log('[LENS] Lens Viewer initialized');

    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const lensId = urlParams.get('lensId') || 'lens';
    const targetWindowId = urlParams.get('targetId') || '';
    const contentType = urlParams.get('type') || 'text';
    const contentPath = urlParams.get('path') || '';
    const hiddenContent = urlParams.get('hiddenContent') || ''; // Hidden content (lens display)

    console.log('[LENS] Parameters:', { lensId, targetWindowId, contentType, contentPath, hiddenContent: hiddenContent.substring(0, 50) });

    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('lens-content');
    const labelEl = document.getElementById('lens-label');

    // Set label
    labelEl.textContent = `🔍 ${lensId}`;

    // Store target window information
    let targetWindowBounds = null;
    let currentLensBounds = null;

    // Load clear content
    async function loadContent() {
      try {
        if (contentType === 'image') {
          await loadImage(contentPath);
        } else if (contentType === 'text') {
          await loadText(contentPath);
        }

        loadingEl.style.display = 'none';
        console.log('[LENS] Content loaded successfully');

        // Start listening for position changes
        startPositionTracking();
      } catch (error) {
        console.error('[LENS] Loading failed:', error);
        loadingEl.textContent = '❌ Loading failed: ' + error.message;
      }
    }

    // Load image (display hidden image)
    async function loadImage(imagePath) {
      console.log('[LENS] Loading image - hidden image');

      // Prioritize hiddenContent (hidden image path)
      let actualImagePath = imagePath;
      if (hiddenContent) {
        actualImagePath = hiddenContent;
        console.log('[LENS] Using hidden image path: ' + actualImagePath);
      }

      if (!actualImagePath) {
        throw new Error('Image path not specified');
      }

      const imageData = await window.electronAPI.loadPicture(actualImagePath);
      
      if (!imageData.success) {
        throw new Error(imageData.error || 'Failed to load image');
      }

      const imgDiv = document.createElement('div');
      imgDiv.className = 'image-content';
      
      const img = document.createElement('img');
      img.src = imageData.dataUrl;
      img.alt = 'Hidden image';
      
      // Calculate offset
      img.onload = () => {
        updateImagePosition();
      };
      
      imgDiv.appendChild(img);
      contentEl.appendChild(imgDiv);
    }

    // Load text (display hidden content)
    async function loadText(textPath) {
      console.log('[LENS] Loading text - hidden content');

      let textContent = '';

      // Prioritize hiddenContent (hidden content)
      if (hiddenContent) {
        textContent = hiddenContent;
        console.log('[LENS] Using hidden content (length: ' + textContent.length + ')');
      } else if (textPath && textPath.startsWith('file://')) {
        // Load from file (backward compatibility)
        const response = await fetch(textPath);
        textContent = await response.text();
      } else if (textPath) {
        // Use passed text directly (backward compatibility)
        textContent = decodeURIComponent(textPath);
      } else {
        // Use same default text as contentViewer
        textContent = 'This is secret text.\n\nOnly through a lens window can you see this content clearly.\n\nYou can try creating a lens window to view the clear text.';
      }

      const textDiv = document.createElement('div');
      textDiv.className = 'text-content';
      textDiv.textContent = textContent;
      
      contentEl.appendChild(textDiv);
    }

    // Start position tracking
    async function startPositionTracking() {
      // First get target window information
      try {
        const targetInfo = await window.api.invoke('window/get-info', targetWindowId);
        if (targetInfo && targetInfo.success) {
          targetWindowBounds = targetInfo.bounds;
          console.log('[LENS] Target window info:', targetWindowBounds);
        }
      } catch (error) {
        console.error('[LENS] Failed to get target window:', error);
      }

      // Get initial lens position
      try {
        const lensInfo = await window.api.invoke('lens/get-position', lensId);
        if (lensInfo && lensInfo.success) {
          currentLensBounds = lensInfo.bounds;
          updateContentPosition();
        }
      } catch (error) {
        console.error('[LENS] Failed to get initial lens position:', error);
      }

      // Use event-driven approach to listen for lens position updates (instead of polling)
      if (window.electronAPI.onLensPositionUpdate) {
        window.electronAPI.onLensPositionUpdate((data) => {
          console.log('[LENS] Lens position update event:', data);
          if (data.lensBounds) {
            currentLensBounds = data.lensBounds;
            // Also update target window bounds (if provided)
            if (data.targetBounds) {
              targetWindowBounds = data.targetBounds;
            }
            updateContentPosition();
          }
        });
      }
    }

    // Update content position (for content cropping and offset)
    function updateContentPosition() {
      if (!targetWindowBounds || !currentLensBounds) return;

      // Calculate lens position relative to target window
      const offsetX = currentLensBounds.x - targetWindowBounds.x;
      const offsetY = currentLensBounds.y - targetWindowBounds.y;

      // Update image position (CSS transform)
      const imgElement = contentEl.querySelector('.image-content img');
      if (imgElement) {
        imgElement.style.transform = `translate(${-offsetX}px, ${-offsetY}px)`;
      }

      // Update text position (CSS transform)
      const textElement = contentEl.querySelector('.text-content');
      if (textElement) {
        textElement.style.transform = `translate(${-offsetX}px, ${-offsetY}px)`;
      }

      console.log('[LENS] Content position updated:', { offsetX, offsetY });
    }

    // Update image position
    function updateImagePosition() {
      // Get target window information and update position
      if (targetWindowId) {
        window.api.invoke('window/get-info', targetWindowId)
          .then(info => {
            if (info) {
              targetWindowBounds = info.bounds;
              updateContentPosition();
            }
          })
          .catch(err => console.error('[LENS] Failed to get target window info:', err));
      }
    }

    // Listen for target window movement (event-driven, no polling needed)
    if (window.electronAPI.onTargetWindowMove) {
      window.electronAPI.onTargetWindowMove((data) => {
        console.log('[LENS] Target window moved:', data);
        if (data.windowId === targetWindowId) {
          targetWindowBounds = data.bounds;
          updateContentPosition();
        }
      });
    }

    // Initial load
    loadContent();
  </script>
</body>
</html>
