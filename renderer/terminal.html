<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #terminal-container {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      overflow-x: hidden;
      word-wrap: break-word;
    }

    #output {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .output-line {
      margin: 2px 0;
    }

    .prompt {
      color: #00ff00;
    }

    .error {
      color: #ff0000;
    }

    .success {
      color: #00ff00;
    }

    .info {
      color: #ffffff;
    }

    .tip {
      color: #ffaa00;
    }

    .command-help {
      color: #00aaff;
    }

    .parameter {
      color: #aa00ff;
    }

    .example {
      color: #888888;
    }

    #input-line {
      display: flex;
      padding: 10px;
      background-color: #000000;
      border-top: 1px solid #333333;
    }

    #prompt-symbol {
      color: #00ff00;
      margin-right: 5px;
    }

    #command-input {
      flex: 1;
      background-color: transparent;
      border: none;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      outline: none;
    }

    #command-input::selection {
      background-color: #00ff00;
      color: #000000;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #000000;
    }

    ::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555555;
    }

    .autocomplete-hint {
      color: #666666;
      position: absolute;
      pointer-events: none;
    }

    /* Drag and drop styles */
    .drag-over {
      background-color: #001100;
      border: 2px dashed #00ff00;
    }

    .drag-feedback {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 255, 0, 0.1);
      border: 2px solid #00ff00;
      padding: 20px;
      border-radius: 8px;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      pointer-events: none;
      z-index: 1000;
      display: none;
    }

    .drag-error {
      color: #ff0000;
      border-color: #ff0000;
      background-color: rgba(255, 0, 0, 0.1);
    }
  </style>
</head>

<body>
  <div id="terminal-container">
    <div id="output">
      <div class="output-line info">Fenestra Terminal v1.0</div>
      <div class="output-line info">Type 'help' to see available commands</div>
      <div class="output-line info">Press Ctrl+~ to close terminal</div>
      <div class="output-line info">---</div>
    </div>
  </div>
  <div id="input-line">
    <span id="prompt-symbol">></span>
    <input type="text" id="command-input" autocomplete="off" autofocus>
  </div>

  <!-- Drag and drop feedback overlay -->
  <div id="drag-feedback" class="drag-feedback">
    Drop .fenestra file to restore window
  </div>

  <script>
    // Command history
    let commandHistory = [];
    let historyIndex = -1;
    let currentCommand = '';

    // Available commands list
    const commands = [
      'help', 'clear', 'list', 'ls', 'getWindows', 'info',
      'get-title', 'set-title', 'set-size', 'set-position', 'set-resizable', 'set-visibility',
      'show', 'hide', 'reload-html',
      'create-picture', 'set-picture', 'set-fit-mode',
      'create-content', 'create-lens', 'set-opacity', 'set-always-on-top',
      'update-blur', 'destroy-lens', 'list-lens', 'lens-list', 'lens-info',
      'save-window', 'restore-window', 'list-saved', 'delete-saved'
    ];

    // AutoCompleter class for handling tab completion logic
    class AutoCompleter {
      constructor() {
        this.currentDirectory = null;
        this.completionCache = new Map();
        this.cacheTimeout = 30000; // 30 seconds cache timeout
        this.performanceStats = {
          totalRequests: 0,
          cacheHits: 0,
          averageResponseTime: 0
        };
        this.initializeCurrentDirectory();
      }

      // Initialize current directory
      async initializeCurrentDirectory() {
        try {
          const result = await window.electronAPI.getCurrentDirectory();
          if (result.success) {
            this.currentDirectory = result.currentDirectory;
          }
        } catch (error) {
          console.error('Failed to get current directory:', error);
        }
      }

      // Get file completions from backend with enhanced error handling and caching
      async getFileCompletions(partialPath) {
        const startTime = Date.now();
        this.performanceStats.totalRequests++;
        
        // Create cache key
        const cacheKey = `${this.currentDirectory}:${partialPath}`;
        
        // Check cache first
        const cached = this.getCachedCompletion(cacheKey);
        if (cached) {
          this.performanceStats.cacheHits++;
          console.debug(`[AUTO_COMPLETE] Cache hit for: ${partialPath}`);
          return cached;
        }
        
        try {
          const result = await window.electronAPI.getFileCompletions({
            partialPath: partialPath,
            currentDir: this.currentDirectory
          });

          const responseTime = Date.now() - startTime;
          this.updatePerformanceStats(responseTime);

          if (result.success) {
            const completionResult = {
              completions: result.completions || [],
              totalMatches: result.totalMatches || 0,
              message: result.message || '',
              hasMore: result.totalMatches > result.completions.length,
              responseTime
            };
            
            // Cache successful results
            this.setCachedCompletion(cacheKey, completionResult);
            
            // Handle performance warnings for large directories
            if (result.totalMatches > 100) {
              console.info(`[AUTO_COMPLETE] Large directory: ${result.totalMatches} matches found in ${responseTime}ms`);
            }
            
            return completionResult;
          } else {
            // Handle specific error cases gracefully
            const errorInfo = {
              completions: [],
              totalMatches: 0,
              message: result.message || 'File completion failed',
              error: result.error || 'UNKNOWN',
              responseTime
            };
            
            // Don't cache error results, but don't log permission errors as warnings
            if (result.error !== 'EACCES') {
              console.warn('File completion failed:', result.message);
            }
            
            return errorInfo;
          }
        } catch (error) {
          const responseTime = Date.now() - startTime;
          this.updatePerformanceStats(responseTime);
          
          console.error('Error getting file completions:', error);
          return {
            completions: [],
            totalMatches: 0,
            message: 'Network error during completion',
            error: 'NETWORK_ERROR',
            responseTime
          };
        }
      }

      // Cache management methods
      getCachedCompletion(key) {
        const cached = this.completionCache.get(key);
        if (cached && Date.now() - cached.timestamp < this.cacheTimeout) {
          return cached.data;
        }
        if (cached) {
          this.completionCache.delete(key);
        }
        return null;
      }

      setCachedCompletion(key, data) {
        // Limit cache size to prevent memory issues
        if (this.completionCache.size > 50) {
          const oldestKey = this.completionCache.keys().next().value;
          this.completionCache.delete(oldestKey);
        }
        
        this.completionCache.set(key, {
          data,
          timestamp: Date.now()
        });
      }

      updatePerformanceStats(responseTime) {
        const stats = this.performanceStats;
        stats.averageResponseTime = (stats.averageResponseTime * (stats.totalRequests - 1) + responseTime) / stats.totalRequests;
        
        // Log performance warnings
        if (responseTime > 2000) {
          console.warn(`[AUTO_COMPLETE] Slow completion response: ${responseTime}ms`);
        }
      }

      // Get performance statistics
      getPerformanceStats() {
        const stats = this.performanceStats;
        const cacheHitRate = stats.totalRequests > 0 ? (stats.cacheHits / stats.totalRequests * 100).toFixed(1) : 0;
        
        return {
          ...stats,
          cacheHitRate: `${cacheHitRate}%`,
          cacheSize: this.completionCache.size
        };
      }

      // Determine if cursor is in a file path parameter position (optimized)
      isInFilePathPosition(inputValue, cursorPosition) {
        const beforeCursor = inputValue.substring(0, cursorPosition);
        
        // Quick check for empty input
        if (!beforeCursor.trim()) return false;
        
        const parts = parseCommand(beforeCursor);
        if (parts.length === 0) return false;

        const command = parts[0].toLowerCase();

        // Commands that expect file paths as parameters (cached set for performance)
        if (!this.filePathCommands) {
          this.filePathCommands = new Set([
            'reload-html', 'create-picture', 'set-picture', 'create-content',
            'restore-window', 'save-window', 'delete-saved'
          ]);
        }

        // If it's a file path command and we're not on the first part (command name)
        if (this.filePathCommands.has(command) && parts.length > 1) {
          return true;
        }

        // Check if we're in the middle of typing a command name (no space after command)
        if (parts.length === 1 && !beforeCursor.endsWith(' ')) {
          return false;
        }

        // Check if the current part looks like a file path
        const currentPart = parts[parts.length - 1] || '';
        
        // Optimized file path detection
        if (this.looksLikeFilePath(currentPart)) {
          return true;
        }

        // If we have a space after the command and we're typing a parameter, 
        // assume it could be a file path for certain commands
        if (this.filePathCommands.has(command) && beforeCursor.endsWith(' ')) {
          return true;
        }

        return false;
      }

      // Optimized file path detection
      looksLikeFilePath(part) {
        if (!part) return false;
        
        // Cache regex patterns for performance
        if (!this.pathPatterns) {
          this.pathPatterns = {
            pathSeparators: /[/\\]/,
            startsWithSpecial: /^[.~]/,
            hasExtension: /\.[a-zA-Z0-9]+$/,
            quotedPath: /^["'].*["']$/
          };
        }
        
        // File path indicators: contains path separators, starts with . or ~, or has file extension
        return this.pathPatterns.pathSeparators.test(part) ||
               this.pathPatterns.startsWithSpecial.test(part) ||
               this.pathPatterns.hasExtension.test(part) ||
               this.pathPatterns.quotedPath.test(part);
      }

      // Get command completions
      getCommandCompletions(partialCommand) {
        return commands.filter(cmd =>
          cmd.toLowerCase().startsWith(partialCommand.toLowerCase())
        );
      }

      // Find common prefix among matches
      findCommonPrefix(matches) {
        if (matches.length === 0) return '';
        if (matches.length === 1) return matches[0];

        let prefix = matches[0];
        for (let i = 1; i < matches.length; i++) {
          let j = 0;
          while (j < prefix.length && j < matches[i].length && 
                 prefix[j].toLowerCase() === matches[i][j].toLowerCase()) {
            j++;
          }
          prefix = prefix.substring(0, j);
          if (prefix === '') break;
        }
        return prefix;
      }

      // Main completion method that handles both command and file completion
      async completeCommand(inputValue, cursorPosition) {
        const beforeCursor = inputValue.substring(0, cursorPosition);
        const afterCursor = inputValue.substring(cursorPosition);
        const parts = parseCommand(beforeCursor);

        // If no input or cursor is at the beginning, complete commands
        if (parts.length === 0 || (parts.length === 1 && !beforeCursor.endsWith(' '))) {
          const partialCommand = parts[0] || '';
          const commandMatches = this.getCommandCompletions(partialCommand);

          if (commandMatches.length === 1) {
            // Single command match - complete it
            const completion = commandMatches[0];
            const newValue = completion + ' ' + afterCursor;
            return {
              success: true,
              completed: true,
              newValue: newValue,
              newCursorPosition: completion.length + 1
            };
          } else if (commandMatches.length > 1) {
            // Multiple command matches - show them with common prefix
            const commonPrefix = this.findCommonPrefix(commandMatches);
            return {
              success: true,
              completed: false,
              matches: commandMatches,
              type: 'command',
              commonPrefix: commonPrefix.length > partialCommand.length ? commonPrefix : ''
            };
          }
        }

        // Check if we should do file path completion
        if (this.isInFilePathPosition(inputValue, cursorPosition)) {
          // Extract the current file path being typed
          const currentPart = parts[parts.length - 1] || '';
          const fileResult = await this.getFileCompletions(currentPart);

          // Handle error cases gracefully
          if (fileResult.error) {
            return {
              success: false,
              completed: false,
              matches: [],
              message: fileResult.message,
              error: fileResult.error
            };
          }

          const fileMatches = fileResult.completions || [];

          if (fileMatches.length === 1) {
            // Single file match - complete it with proper directory and special character handling
            const match = fileMatches[0];
            const partsBeforeCurrent = parts.slice(0, -1);
            
            // Use escaped name for files with special characters
            let completedPath = match.hasSpecialChars ? match.escapedName : match.name;
            
            // For directories, ensure trailing slash
            if (match.type === 'directory' && !completedPath.endsWith('/')) {
              completedPath += '/';
            }

            // Rebuild the command with the completed path
            const newParts = [...partsBeforeCurrent, completedPath];
            const newValue = newParts.join(' ') + (match.type === 'directory' ? '' : ' ') + afterCursor;
            const newCursorPosition = newParts.join(' ').length + (match.type === 'directory' ? 0 : 1);

            return {
              success: true,
              completed: true,
              newValue: newValue,
              newCursorPosition: newCursorPosition
            };
          } else if (fileMatches.length > 1) {
            // Multiple file matches - show them with common prefix and directory indicators
            const matchNames = fileMatches.map(m => 
              m.type === 'directory' && !m.name.endsWith('/') ? m.name + '/' : m.name
            );
            const commonPrefix = this.findCommonPrefix(matchNames);
            
            return {
              success: true,
              completed: false,
              matches: matchNames,
              type: 'file',
              commonPrefix: commonPrefix.length > currentPart.length ? commonPrefix : '',
              totalMatches: fileResult.totalMatches,
              hasMore: fileResult.hasMore,
              message: fileResult.message
            };
          } else {
            // No matches found
            return {
              success: false,
              completed: false,
              matches: [],
              message: fileResult.message || 'No matching files found'
            };
          }
        }

        // No completions found
        return {
          success: false,
          completed: false,
          matches: []
        };
      }
    }

    // Create global autocompleter instance
    const autoCompleter = new AutoCompleter();

    // Parse command with help detection
    function parseCommandWithHelp(cmdStr) {
      const parts = parseCommand(cmdStr);
      const cmd = parts[0]?.toLowerCase();
      const args = parts.slice(1);

      // Check for help flags (--help or -h)
      if (args.includes('--help') || args.includes('-h')) {
        return { command: 'help', args: [cmd] };
      }

      // Check for help command with specific command
      if (cmd === 'help' && args.length > 0) {
        return { command: 'help', args: [args[0].toLowerCase()] };
      }

      return { command: cmd, args: args };
    }

    function showCommandHelp(commandName) {

      if (!helpData) {

    // Find similar commands using enhanced fuzzy matching
    function findSimilarCommands(input) {
      const allCommands = Object.keys(commandHelp);
      const suggestions = [];
      
      // Calculate similarity scores for all commands
      const scoredCommands = allCommands.map(cmd => ({
        command: cmd,
        score: calculateCommandSimilarity(input.toLowerCase(), cmd.toLowerCase())
      }));
      
      // Sort by similarity score (higher is better)
      scoredCommands.sort((a, b) => b.score - a.score);
      
      // Filter commands with reasonable similarity scores
      const threshold = 0.3; // Minimum similarity threshold
      const similarCommands = scoredCommands
        .filter(item => item.score >= threshold)
        .slice(0, 5) // Return top 5 suggestions
        .map(item => item.command);
      
      return similarCommands;
    }

    // Calculate similarity between input and command using multiple algorithms
    function calculateCommandSimilarity(input, command) {
      if (input === command) return 1.0;
      if (input.length === 0 || command.length === 0) return 0.0;
      
      let score = 0;
      
      // 1. Exact prefix match (highest weight)
      if (command.startsWith(input)) {
        score += 0.8;
      }
      
      // 2. Contains match
      if (command.includes(input)) {
        score += 0.6;
      }
      
      // 3. Levenshtein distance similarity
      const levenshteinSimilarity = 1 - (levenshteinDistance(input, command) / Math.max(input.length, command.length));
      score += levenshteinSimilarity * 0.4;
      
      // 4. Character frequency similarity
      const charSimilarity = calculateCharacterSimilarity(input, command);
      score += charSimilarity * 0.3;
      
      // 5. Length similarity bonus
      const lengthDiff = Math.abs(input.length - command.length);
      const maxLength = Math.max(input.length, command.length);
      const lengthSimilarity = 1 - (lengthDiff / maxLength);
      score += lengthSimilarity * 0.2;
      
      // 6. Common subsequence bonus
      const subsequenceLength = longestCommonSubsequence(input, command);
      const subsequenceSimilarity = subsequenceLength / Math.max(input.length, command.length);
      score += subsequenceSimilarity * 0.3;
      
      // Normalize score to 0-1 range
      return Math.min(score, 1.0);
    }

    // Calculate Levenshtein distance between two strings
    function levenshteinDistance(str1, str2) {
      const matrix = Array(str2.length + 1).fill(null).map(() => Array(str1.length + 1).fill(null));
      
      for (let i = 0; i <= str1.length; i++) matrix[0][i] = i;
      for (let j = 0; j <= str2.length; j++) matrix[j][0] = j;
      
      for (let j = 1; j <= str2.length; j++) {
        for (let i = 1; i <= str1.length; i++) {
          const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
          matrix[j][i] = Math.min(
            matrix[j][i - 1] + 1,     // deletion
            matrix[j - 1][i] + 1,     // insertion
            matrix[j - 1][i - 1] + indicator // substitution
          );
        }
      }
      
      return matrix[str2.length][str1.length];
    }

    // Calculate character frequency similarity
    function calculateCharacterSimilarity(str1, str2) {
      const freq1 = {};
      const freq2 = {};
      
      for (let char of str1) {
        freq1[char] = (freq1[char] || 0) + 1;
      }
      
      for (let char of str2) {
        freq2[char] = (freq2[char] || 0) + 1;
      }
      
      const allChars = new Set([...Object.keys(freq1), ...Object.keys(freq2)]);
      let similarity = 0;
      
      for (let char of allChars) {
        const f1 = freq1[char] || 0;
        const f2 = freq2[char] || 0;
        similarity += Math.min(f1, f2);
      }
      
      return similarity / Math.max(str1.length, str2.length);
    }

    // Find longest common subsequence length
    function longestCommonSubsequence(str1, str2) {
      const m = str1.length;
      const n = str2.length;
      const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
      
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (str1[i - 1] === str2[j - 1]) {
            dp[i][j] = dp[i - 1][j - 1] + 1;
          } else {
            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
          }
        }
      }
      
      return dp[m][n];
    }

    // Execute command
    async function executeCommand(cmdStr) {
      if (!cmdStr.trim()) return;

      // Display executed command
      print(`> ${cmdStr}`, 'prompt');

      // Add to history
      commandHistory.push(cmdStr);
      historyIndex = commandHistory.length;
      currentCommand = '';

      // Parse command with help detection
      const parsed = parseCommandWithHelp(cmdStr);
      const cmd = parsed.command;
      const args = parsed.args;

      // Execute local commands
      if (cmd === 'help') {
        if (args.length > 0) {
          showCommandHelp(args[0]);
        } else {
          showHelp();
        }
      } else if (cmd === 'clear') {
        clearTerminal();
      } else {
        // Send to main process for handling
        try {
          const result = await window.electronAPI.executeTerminalCommand(cmd, args);
          if (result.success) {
            if (result.message) {
              print(result.message, 'success');
            }
            if (result.data) {
              print(JSON.stringify(result.data, null, 2), 'info');
            }
          } else {
            print(`[ERROR] ${result.message}`, 'error');
          }
        } catch (error) {
          print(`[ERROR] ${error.message}`, 'error');
        }
      }
    }

    // Parse command (supports quotes)
    function parseCommand(str) {
      const parts = [];
      let current = '';
      let inQuotes = false;
      let quoteChar = '';

      for (let i = 0; i < str.length; i++) {
        const char = str[i];

        if ((char === '"' || char === "'") && (!inQuotes || char === quoteChar)) {
          if (inQuotes) {
            inQuotes = false;
            quoteChar = '';
          } else {
            inQuotes = true;
            quoteChar = char;
          }
        } else if (char === ' ' && !inQuotes) {
          if (current) {
            parts.push(current);
            current = '';
          }
        } else {
          current += char;
        }
      }

      if (current) {
        parts.push(current);
      }

      return parts;
    }

    // Display completion matches with enhanced formatting
    function displayCompletionMatches(matches, type, result = {}) {
      if (matches.length === 0) return;

      const matchType = type === 'command' ? 'commands' : 'files';
      print(`Available ${matchType}:`, 'info');

      // Sort matches: directories first (with /), then files
      const sortedMatches = [...matches].sort((a, b) => {
        const aIsDir = a.endsWith('/');
        const bIsDir = b.endsWith('/');
        
        if (aIsDir && !bIsDir) return -1;
        if (!aIsDir && bIsDir) return 1;
        return a.localeCompare(b, undefined, { sensitivity: 'base' });
      });

      // Display matches in columns for better readability
      const maxLength = Math.max(...sortedMatches.map(m => m.length));
      const terminalWidth = 80;
      const columns = Math.max(1, Math.floor(terminalWidth / (maxLength + 3)));

      for (let i = 0; i < sortedMatches.length; i += columns) {
        const row = sortedMatches.slice(i, i + columns);
        const paddedRow = row.map(match => {
          // Add visual indicators
          let displayMatch = match;
          
          // Highlight directories with different color
          if (match.endsWith('/')) {
            // Directory indicator is already in the name
            displayMatch = match;
          }
          
          // Handle files with special characters
          if (type === 'file' && /[\s'"\\&|<>(){}[\]$`!?*;]/.test(match)) {
            // Add subtle indicator for files with special characters
            displayMatch = match;
          }
          
          return displayMatch.padEnd(maxLength + 3);
        });
        print(paddedRow.join(''), 'info');
      }

      // Show additional information
      if (result.totalMatches && result.totalMatches > matches.length) {
        print(`(Showing ${matches.length} of ${result.totalMatches} matches)`, 'info');
        printTip('Type more characters to narrow down results');
      } else if (matches.length > 10) {
        print(`(${matches.length} matches total)`, 'info');
      }
      
      // Show performance or access messages
      if (result.message && result.message.includes('大目录')) {
        printTip('Large directory detected - completion may be slower');
      }
      
      // Show tips for special characters
      const hasSpecialChars = matches.some(match => /[\s'"\\&|<>(){}[\]$`!?*;]/.test(match));
      if (hasSpecialChars && type === 'file') {
        printTip('Files with spaces or special characters will be automatically quoted');
      }
    }

    // Input event listeners
    inputEl.addEventListener('keydown', async (e) => {
      // Enter - execute command
      if (e.key === 'Enter') {
        const cmd = inputEl.value;
        inputEl.value = '';
        await executeCommand(cmd);
      }
      // Tab - auto completion
      else if (e.key === 'Tab') {
        e.preventDefault();

        const cursorPosition = inputEl.selectionStart;
        const inputValue = inputEl.value;

        try {
          const result = await autoCompleter.completeCommand(inputValue, cursorPosition);

          if (result.success && result.completed) {
            // Single completion found - apply it
            inputEl.value = result.newValue;
            inputEl.setSelectionRange(result.newCursorPosition, result.newCursorPosition);
          } else if (result.success && result.matches && result.matches.length > 0) {
            // Multiple completions found - display them and apply common prefix if available
            displayCompletionMatches(result.matches, result.type, result);
            
            // Show additional info for large result sets
            if (result.hasMore) {
              print(`(Showing ${result.matches.length} of ${result.totalMatches} matches)`, 'info');
            }
            
            // Try to complete common prefix for multiple matches
            if (result.commonPrefix && result.commonPrefix.length > 0) {
              const beforeCursor = inputValue.substring(0, cursorPosition);
              const afterCursor = inputValue.substring(cursorPosition);
              const parts = parseCommand(beforeCursor);
              
              if (result.type === 'file') {
                // Replace the current partial path with the common prefix
                const partsBeforeCurrent = parts.slice(0, -1);
                const newParts = [...partsBeforeCurrent, result.commonPrefix];
                const newValue = newParts.join(' ') + afterCursor;
                const newCursorPosition = newParts.join(' ').length;
                
                inputEl.value = newValue;
                inputEl.setSelectionRange(newCursorPosition, newCursorPosition);
              } else if (result.type === 'command' && parts.length <= 1) {
                // Replace the partial command with the common prefix
                const newValue = result.commonPrefix + afterCursor;
                const newCursorPosition = result.commonPrefix.length;
                
                inputEl.value = newValue;
                inputEl.setSelectionRange(newCursorPosition, newCursorPosition);
              }
            }
          } else {
            // Handle different types of completion failures
            if (result.error) {
              // Specific error occurred
              if (result.error === 'EACCES') {
                print('Permission denied - cannot access directory', 'error');
              } else if (result.error === 'ENOENT') {
                print('Path does not exist', 'error');
              } else if (result.error === 'ENOTDIR') {
                print('Path is not a directory', 'error');
              } else {
                print(result.message || 'Auto-completion failed', 'error');
              }
            } else {
              // No completions found
              print(result.message || 'No completions available', 'info');
            }
          }
        } catch (error) {
          console.error('Auto-completion error:', error);
          
          // Provide user-friendly error messages
          if (error.message.includes('timeout')) {
            print('Auto-completion timed out - directory may be too large', 'error');
          } else if (error.message.includes('network')) {
            print('Auto-completion service unavailable', 'error');
          } else {
            print('Auto-completion failed - please try again', 'error');
          }
        }
      }
      // Up arrow - previous command
      else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (historyIndex > 0) {
          if (historyIndex === commandHistory.length) {
            currentCommand = inputEl.value;
          }
          historyIndex--;
          inputEl.value = commandHistory[historyIndex];
        }
      }
      // Down arrow - next command
      else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (historyIndex < commandHistory.length) {
          historyIndex++;
          if (historyIndex === commandHistory.length) {
            inputEl.value = currentCommand;
          } else {
            inputEl.value = commandHistory[historyIndex];
          }
        }
      }
    });

    // Keep focus on input box
    document.addEventListener('click', () => {
      inputEl.focus();
    });

    // Drag and drop functionality
    const terminalContainer = document.getElementById('terminal-container');
    const dragFeedback = document.getElementById('drag-feedback');
    let dragCounter = 0;

    // Prevent default drag behaviors on the entire document
    document.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    document.addEventListener('drop', (e) => {
      e.preventDefault();
    });

    // Handle drag enter
    terminalContainer.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;

      if (dragCounter === 1) {
        terminalContainer.classList.add('drag-over');
        dragFeedback.style.display = 'block';

        // Check if the dragged item contains files
        const hasFiles = e.dataTransfer.types.includes('Files');
        if (!hasFiles) {
          dragFeedback.textContent = 'Only files are supported';
          dragFeedback.classList.add('drag-error');
        } else {
          dragFeedback.textContent = 'Drop .fenestra file to restore window';
          dragFeedback.classList.remove('drag-error');
        }
      }
    });

    // Handle drag over
    terminalContainer.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    // Handle drag leave
    terminalContainer.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;

      if (dragCounter === 0) {
        terminalContainer.classList.remove('drag-over');
        dragFeedback.style.display = 'none';
        dragFeedback.classList.remove('drag-error');
      }
    });

    // Handle file drop
    terminalContainer.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragCounter = 0;

      // Remove visual feedback
      terminalContainer.classList.remove('drag-over');
      dragFeedback.style.display = 'none';
      dragFeedback.classList.remove('drag-error');

      const files = Array.from(e.dataTransfer.files);

      if (files.length === 0) {
        print('[ERROR] No files detected in drop operation', 'error');
        return;
      }

      if (files.length > 1) {
        print('[ERROR] Please drop only one file at a time', 'error');
        return;
      }

      const file = files[0];

      // Validate file extension
      if (!file.name.toLowerCase().endsWith('.fenestra')) {
        print(`[ERROR] Invalid file type: ${file.name}. Only .fenestra files are supported`, 'error');
        return;
      }

      // Extract file path and populate command input
      const filePath = file.path || file.name;

      try {
        // Validate that the file is readable and contains valid JSON
        await validateFenestraFile(filePath);

        // Populate the command input with restore command
        const restoreCommand = `restore-window "${filePath}"`;
        inputEl.value = restoreCommand;

        print(`[INFO] File dropped: ${file.name}`, 'info');
        print('[INFO] Press Enter to restore the window, or edit the command as needed', 'info');

        // Focus the input for immediate execution
        inputEl.focus();

      } catch (error) {
        print(`[ERROR] Invalid .fenestra file: ${error.message}`, 'error');
      }
    });

    // Function to validate .fenestra file
    async function validateFenestraFile(filePath) {
      try {
        // Use the electron API to read and validate the file
        const result = await window.electronAPI.validateFenestraFile(filePath);

        if (!result.success) {
          throw new Error(result.message || 'File validation failed');
        }

        return result.data;
      } catch (error) {
        // If the API doesn't exist yet, do basic validation
        if (error.message.includes('validateFenestraFile is not a function')) {
          // Basic file extension check already done above
          return true;
        }
        throw error;
      }
    }

    // Welcome message
    print('', 'info');
  </script>
</body>
