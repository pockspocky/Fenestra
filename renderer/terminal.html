<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>终端</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #terminal-container {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      overflow-x: hidden;
      word-wrap: break-word;
    }

    #output {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .output-line {
      margin: 2px 0;
    }

    .prompt {
      color: #00ff00;
    }

    .error {
      color: #ff0000;
    }

    .success {
      color: #00ff00;
    }

    .info {
      color: #ffffff;
    }

    #input-line {
      display: flex;
      padding: 10px;
      background-color: #000000;
      border-top: 1px solid #333333;
    }

    #prompt-symbol {
      color: #00ff00;
      margin-right: 5px;
    }

    #command-input {
      flex: 1;
      background-color: transparent;
      border: none;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      outline: none;
    }

    #command-input::selection {
      background-color: #00ff00;
      color: #000000;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #000000;
    }

    ::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555555;
    }

    .autocomplete-hint {
      color: #666666;
      position: absolute;
      pointer-events: none;
    }

    /* Drag and drop styles */
    .drag-over {
      background-color: #001100;
      border: 2px dashed #00ff00;
    }

    .drag-feedback {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 255, 0, 0.1);
      border: 2px solid #00ff00;
      padding: 20px;
      border-radius: 8px;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      pointer-events: none;
      z-index: 1000;
      display: none;
    }

    .drag-error {
      color: #ff0000;
      border-color: #ff0000;
      background-color: rgba(255, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div id="terminal-container">
    <div id="output">
      <div class="output-line info">Fenestra Terminal v1.0</div>
      <div class="output-line info">输入 'help' 查看可用命令</div>
      <div class="output-line info">按 Ctrl+~ 关闭终端</div>
      <div class="output-line info">---</div>
    </div>
  </div>
  <div id="input-line">
    <span id="prompt-symbol">></span>
    <input type="text" id="command-input" autocomplete="off" autofocus>
  </div>
  
  <!-- Drag and drop feedback overlay -->
  <div id="drag-feedback" class="drag-feedback">
    Drop .fenestra file to restore window
  </div>

  <script>
    // 命令历史
    let commandHistory = [];
    let historyIndex = -1;
    let currentCommand = '';

    // 可用命令列表
    const commands = [
      'help', 'clear', 'list', 'ls', 'getWindows', 'info',
      'get-title', 'set-title', 'set-size', 'set-position', 'set-resizable', 'set-visibility',
      'show', 'hide', 'reload-html',
      'create-picture', 'set-picture', 'set-fit-mode',
      'create-content', 'create-lens', 'set-opacity', 'set-always-on-top', 
      'update-blur', 'destroy-lens', 'list-lens', 'lens-list', 'lens-info',
      'save-window', 'restore-window', 'list-saved', 'delete-saved'
    ];

    // 获取元素
    const outputEl = document.getElementById('output');
    const inputEl = document.getElementById('command-input');

    // 输出消息到终端
    function print(message, type = 'info') {
      const line = document.createElement('div');
      line.className = `output-line ${type}`;
      line.textContent = message;
      outputEl.appendChild(line);
      
      // 自动滚动到底部
      const container = document.getElementById('terminal-container');
      container.scrollTop = container.scrollHeight;
    }

    // 执行命令
    async function executeCommand(cmdStr) {
      if (!cmdStr.trim()) return;

      // 显示执行的命令
      print(`> ${cmdStr}`, 'prompt');

      // 添加到历史
      commandHistory.push(cmdStr);
      historyIndex = commandHistory.length;
      currentCommand = '';

      // 解析命令
      const parts = parseCommand(cmdStr);
      const cmd = parts[0]?.toLowerCase();
      const args = parts.slice(1);

      // 执行本地命令
      if (cmd === 'help') {
        showHelp();
      } else if (cmd === 'clear') {
        clearTerminal();
      } else {
        // 发送到主进程处理
        try {
          const result = await window.electronAPI.executeTerminalCommand(cmd, args);
          if (result.success) {
            if (result.message) {
              print(result.message, 'success');
            }
            if (result.data) {
              print(JSON.stringify(result.data, null, 2), 'info');
            }
          } else {
            print(`[ERROR] ${result.message}`, 'error');
          }
        } catch (error) {
          print(`[ERROR] ${error.message}`, 'error');
        }
      }
    }

    // 解析命令（支持引号）
    function parseCommand(str) {
      const parts = [];
      let current = '';
      let inQuotes = false;
      let quoteChar = '';

      for (let i = 0; i < str.length; i++) {
        const char = str[i];
        
        if ((char === '"' || char === "'") && (!inQuotes || char === quoteChar)) {
          if (inQuotes) {
            inQuotes = false;
            quoteChar = '';
          } else {
            inQuotes = true;
            quoteChar = char;
          }
        } else if (char === ' ' && !inQuotes) {
          if (current) {
            parts.push(current);
            current = '';
          }
        } else {
          current += char;
        }
      }

      if (current) {
        parts.push(current);
      }

      return parts;
    }

    // 显示帮助信息
    function showHelp() {
      print('--- 可用命令 ---', 'info');
      print('', 'info');
      print('基础命令:', 'info');
      print('  help                              - 显示此帮助信息', 'info');
      print('  clear                             - 清空终端', 'info');
      print('  list, ls                          - 列出所有窗口', 'info');
      print('  getWindows                        - 获取所有窗口详细信息', 'info');
      print('  info [窗口ID]                     - 查看窗口详细信息', 'info');
      print('', 'info');
      print('窗口操作命令:', 'info');
      print('  get-title [ID]                    - 获取窗口标题', 'info');
      print('  set-title [ID] "标题"             - 设置窗口标题', 'info');
      print('  set-size [ID] [宽度] [高度]       - 设置窗口大小', 'info');
      print('  set-position [ID] [x] [y]         - 设置窗口位置', 'info');
      print('  set-resizable [ID] [true/false]   - 设置是否可调整大小', 'info');
      print('  set-visibility [ID] [true/false]  - 设置窗口可见性', 'info');
      print('  show [ID]                         - 显示窗口', 'info');
      print('  hide [ID]                         - 隐藏窗口', 'info');
      print('  reload-html [ID] [htmlPath]       - 重新加载HTML文件', 'info');
      print('', 'info');
      print('图片窗口命令:', 'info');
      print('  create-picture [ID] [路径] [模式] - 创建图片窗口', 'info');
      print('      模式: fill/contain/cover/scale-down/none', 'info');
      print('  set-picture [ID] [路径] [模式]    - 更改窗口显示的图片', 'info');
      print('  set-fit-mode [ID] [模式]          - 更改图片缩放模式', 'info');
      print('', 'info');
      print('镜头系统命令:', 'info');
      print('  create-content [ID] [类型] [路径] [模糊度] [是否模糊]', 'info');
      print('      - 创建内容窗口（text/image，模糊度0-50）', 'info');
      print('  create-lens [镜头ID] [目标ID] [宽] [高]', 'info');
      print('      - 创建镜头窗口（最多3个）', 'info');
      print('  set-opacity [ID] [0-1]            - 设置窗口透明度', 'info');
      print('  set-always-on-top [ID] [true/false] - 设置窗口置顶', 'info');
      print('  update-blur [ID] [0-50]           - 更新内容模糊度', 'info');
      print('  destroy-lens [镜头ID]             - 销毁镜头系统', 'info');
      print('  list-lens, lens-list              - 列出所有镜头', 'info');
      print('  lens-info [镜头ID]                - 查看镜头详情', 'info');
      print('', 'info');
      print('窗口存储命令:', 'info');
      print('  save-window [ID] [文件名]         - 保存窗口配置到文件', 'info');
      print('      示例: save-window window1 my-config', 'info');
      print('      文件名可选，默认使用时间戳命名', 'info');
      print('  restore-window [文件路径]         - 从文件恢复窗口', 'info');
      print('      示例: restore-window .fenestra-storage/window1.fenestra', 'info');
      print('      支持拖拽.fenestra文件到终端', 'info');
      print('  list-saved                        - 列出所有已保存的窗口文件', 'info');
      print('  delete-saved [文件名]             - 删除已保存的窗口文件', 'info');
      print('      示例: delete-saved window1-20241014.fenestra', 'info');
      print('', 'info');
      print('提示: 使用 Tab 键自动补全命令和窗口ID', 'info');
      print('提示: 使用上下箭头浏览命令历史', 'info');
      print('提示: 图片路径支持绝对路径和相对路径', 'info');
      print('提示: 镜头窗口可显示底层模糊内容的清晰版本', 'info');
      print('提示: 窗口配置文件保存在.fenestra-storage目录', 'info');
      print('提示: 可拖拽.fenestra文件到终端快速恢复窗口', 'info');
    }

    // 清空终端
    function clearTerminal() {
      outputEl.innerHTML = '';
    }

    // 自动补全
    function autocomplete(input) {
      const parts = input.trim().split(/\s+/);
      
      if (parts.length === 1) {
        // 补全命令
        const matches = commands.filter(cmd => cmd.startsWith(parts[0].toLowerCase()));
        return matches.length === 1 ? matches[0] : null;
      } else {
        // 补全窗口ID（需要从主进程获取）
        return null;
      }
    }

    // 输入事件监听
    inputEl.addEventListener('keydown', async (e) => {
      // Enter - 执行命令
      if (e.key === 'Enter') {
        const cmd = inputEl.value;
        inputEl.value = '';
        await executeCommand(cmd);
      }
      // Tab - 自动补全
      else if (e.key === 'Tab') {
        e.preventDefault();
        const completion = autocomplete(inputEl.value);
        if (completion) {
          inputEl.value = completion + ' ';
        }
      }
      // 上箭头 - 上一条命令
      else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (historyIndex > 0) {
          if (historyIndex === commandHistory.length) {
            currentCommand = inputEl.value;
          }
          historyIndex--;
          inputEl.value = commandHistory[historyIndex];
        }
      }
      // 下箭头 - 下一条命令
      else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (historyIndex < commandHistory.length) {
          historyIndex++;
          if (historyIndex === commandHistory.length) {
            inputEl.value = currentCommand;
          } else {
            inputEl.value = commandHistory[historyIndex];
          }
        }
      }
    });

    // 保持焦点在输入框
    document.addEventListener('click', () => {
      inputEl.focus();
    });

    // Drag and drop functionality
    const terminalContainer = document.getElementById('terminal-container');
    const dragFeedback = document.getElementById('drag-feedback');
    let dragCounter = 0;

    // Prevent default drag behaviors on the entire document
    document.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    document.addEventListener('drop', (e) => {
      e.preventDefault();
    });

    // Handle drag enter
    terminalContainer.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      
      if (dragCounter === 1) {
        terminalContainer.classList.add('drag-over');
        dragFeedback.style.display = 'block';
        
        // Check if the dragged item contains files
        const hasFiles = e.dataTransfer.types.includes('Files');
        if (!hasFiles) {
          dragFeedback.textContent = 'Only files are supported';
          dragFeedback.classList.add('drag-error');
        } else {
          dragFeedback.textContent = 'Drop .fenestra file to restore window';
          dragFeedback.classList.remove('drag-error');
        }
      }
    });

    // Handle drag over
    terminalContainer.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    // Handle drag leave
    terminalContainer.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      
      if (dragCounter === 0) {
        terminalContainer.classList.remove('drag-over');
        dragFeedback.style.display = 'none';
        dragFeedback.classList.remove('drag-error');
      }
    });

    // Handle file drop
    terminalContainer.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragCounter = 0;
      
      // Remove visual feedback
      terminalContainer.classList.remove('drag-over');
      dragFeedback.style.display = 'none';
      dragFeedback.classList.remove('drag-error');
      
      const files = Array.from(e.dataTransfer.files);
      
      if (files.length === 0) {
        print('[ERROR] No files detected in drop operation', 'error');
        return;
      }
      
      if (files.length > 1) {
        print('[ERROR] Please drop only one file at a time', 'error');
        return;
      }
      
      const file = files[0];
      
      // Validate file extension
      if (!file.name.toLowerCase().endsWith('.fenestra')) {
        print(`[ERROR] Invalid file type: ${file.name}. Only .fenestra files are supported`, 'error');
        return;
      }
      
      // Extract file path and populate command input
      const filePath = file.path || file.name;
      
      try {
        // Validate that the file is readable and contains valid JSON
        await validateFenestraFile(filePath);
        
        // Populate the command input with restore command
        const restoreCommand = `restore-window "${filePath}"`;
        inputEl.value = restoreCommand;
        
        print(`[INFO] File dropped: ${file.name}`, 'info');
        print('[INFO] Press Enter to restore the window, or edit the command as needed', 'info');
        
        // Focus the input for immediate execution
        inputEl.focus();
        
      } catch (error) {
        print(`[ERROR] Invalid .fenestra file: ${error.message}`, 'error');
      }
    });

    // Function to validate .fenestra file
    async function validateFenestraFile(filePath) {
      try {
        // Use the electron API to read and validate the file
        const result = await window.electronAPI.validateFenestraFile(filePath);
        
        if (!result.success) {
          throw new Error(result.message || 'File validation failed');
        }
        
        return result.data;
      } catch (error) {
        // If the API doesn't exist yet, do basic validation
        if (error.message.includes('validateFenestraFile is not a function')) {
          // Basic file extension check already done above
          return true;
        }
        throw error;
      }
    }

    // 欢迎信息
    print('', 'info');
  </script>
</body>
</html>
